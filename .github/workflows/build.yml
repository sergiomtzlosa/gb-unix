name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ROM
        run: |
          make
          test -f gb-unix.gb

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: gb-unix-rom
          path: gb-unix.gb

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download built ROM
        uses: actions/download-artifact@v4
        with:
          name: gb-unix-rom
          path: dist

      - name: Package release assets
        run: |
          set -eu
          version="${TAG#v}"
          rom="dist/gb-unix-${version}.gb"
          tarball="dist/gb-unix-${version}.tar.gz"

          mv dist/gb-unix.gb "$rom"

          # Source tarball without the tracked build output; the ROM is
          # shipped separately above.
          git archive --format=tar --prefix=gb-unix/ -o dist/gb-unix-src.tar HEAD
          tar --delete -f dist/gb-unix-src.tar gb-unix/gb-unix.gb
          gzip -9 -n -c dist/gb-unix-src.tar > "$tarball"
          rm -f dist/gb-unix-src.tar

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" \
            "dist/gb-unix-${version}.gb" \
            "dist/gb-unix-${version}.tar.gz" \
            --clobber
