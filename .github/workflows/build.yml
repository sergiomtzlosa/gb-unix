name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach release assets to (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty except for manual runs that target an existing tag.
          ref: ${{ inputs.tag }}

      - name: Build ROM
        run: |
          make
          test -f gb-unix.gb

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: gb-unix-rom
          path: gb-unix.gb

  release:
    # Pushing a version tag publishes a release; a manual run can target an
    # existing tag too. Releases created below use GITHUB_TOKEN, which does
    # not trigger another workflow run.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download built ROM
        uses: actions/download-artifact@v4
        with:
          name: gb-unix-rom
          path: dist

      - name: Package release assets
        run: |
          set -eu
          version="${TAG#v}"
          rom="dist/gb-unix-${version}.gb"
          tarball="dist/gb-unix-${version}.tar.gz"

          mv dist/gb-unix.gb "$rom"

          # Source tarball without the tracked build output; the ROM is
          # shipped separately above.
          git archive --format=tar --prefix=gb-unix/ -o dist/gb-unix-src.tar HEAD
          tar --delete -f dist/gb-unix-src.tar gb-unix/gb-unix.gb
          gzip -9 -n -c dist/gb-unix-src.tar > "$tarball"
          rm -f dist/gb-unix-src.tar

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" \
            "dist/gb-unix-${version}.gb" \
            "dist/gb-unix-${version}.tar.gz" \
            --clobber
